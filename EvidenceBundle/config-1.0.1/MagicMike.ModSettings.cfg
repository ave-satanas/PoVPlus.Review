[General]

## The key that opens and closes the Mod Settings panel.
# Setting type: KeyboardShortcut
# Default value: F7
Toggle Key = F7 + LeftShift

## How many setting rows the list moves for each notch of the mouse wheel.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 10
Scroll Speed = 3

## Where the panel was last dragged to, across from the centre of the screen.
# Setting type: Single
# Default value: 0
Panel Position X = 0

## Where the panel was last dragged to, up from the centre of the screen.
# Setting type: Single
# Default value: 0
Panel Position Y = 0

