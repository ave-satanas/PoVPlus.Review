# Acceptable values: Off, On
Lock Configuration = On

## Client-side admin convenience. If on, host or server-admin players use SecondaryAttacks presets without preset cooldowns. This does not change server-synced YAML values and does not remove internal hit throttles. [Not Synced with Server]
