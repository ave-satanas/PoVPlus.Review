# Default value: Off
# Acceptable values: Off, On
Admin No Preset Cooldowns = Off

## Remembers the most recently equipped shield and automatically equips that exact shield after a one-handed weapon is successfully equipped while the left hand is empty. The shield must be in the player's inventory. This feature disables itself when ShieldMeBruh is loaded. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Auto Equip Last Shield = On

## Enables the fixed quickstep for equipped Knives and Unarmed weapons. Bare fists are excluded. Quickstep uses 200 horizontal acceleration for 0.25 seconds, full-duration invincibility without a shield, 0.15 seconds of invincibility with a shield, and a 0.5-second cooldown. Quickstep and its double-press dodge handoff each consume 60% of the current dodge stamina cost. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Quickstep Enabled = On

## Sneak skill raise amount awarded whenever any attack successfully triggers backstab damage. 0 disables this reward. [Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
Backstab Sneak Skill Raise Amount = 1

## Multiplier for the visibility reduction gained from Sneak skill while crouching. 1.0 keeps vanilla; 2.0 doubles only the skill-based reduction. Visibility is clamped to a fixed minimum of 0.1. At factor 1.0, Sneak 0 is 0.5 in darkness and 1.0 in bright light; Sneak 100 is 0.2 in darkness and 0.6 in bright light. [Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 2
Sneak Visibility Skill Effect Factor = 2

## Sneak movement speed multiplier at Sneak skill 100 while crouching. 1.0 keeps vanilla; 2.0 doubles crouched movement speed at Sneak 100, with lower Sneak levels linearly interpolated. [Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 2
Sneak Movement Speed Skill Factor = 2

## If on, periodic Fire, Spirit, and Poison damage-over-time ticks do not cancel the player's crouch toggle. Direct hits, lethal damage, stagger, and knockback retain vanilla behavior. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Keep Crouching During Elemental Damage Over Time = On

[2 - Blood Magic]

## Global quality preset for BloodMagic summon items whose primary or secondary projectile resolves to a SpawnAbility. Explicit summon.qualityPreset values in SecondaryAttacks.BloodMagic.yml override this. Off disables automatic quality scaling; CountByQuality makes item quality raise active summon count; LevelByQuality makes item quality raise summoned creature level. [Synced with Server]
# Setting type: MagicSummonQualityPresetSelection
# Default value: LevelByQuality
# Acceptable values: Off, CountByQuality, LevelByQuality
Magic Summon Quality Preset = LevelByQuality

## Base lifetime in whole seconds for creatures summoned by player-used Blood Magic staves. 0 disables summon lifetime assignment, restoration, expiration, and HUD timers, including staff-specific YAML overrides. Positive values enable the feature. The configured base is assigned only to newly created summons; existing assigned deadlines are not recalculated. [Synced with Server]
# Setting type: Int32
# Default value: 1200
# Acceptable values: Non-negative whole numbers (0 or greater)
Blood Magic Summon Lifetime Seconds = 1200

## Multiplier applied to the base summon lifetime at Blood Magic skill 100. Skill 0 uses the base lifetime, with intermediate skill levels interpolated linearly. [Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 10
Blood Magic Summon Lifetime Multiplier At Skill 100 = 2

## If on, Blood Magic attack health percentage costs are calculated from max health at cast time instead of current health. Flat health cost and Blood Magic skill cost reduction are unchanged. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Blood Magic Health Cost Uses Max Health = On

## Additional Blood Magic skill raise amount per actual consumed health. Vanilla Blood Magic skill gain always remains active. 0 disables only this custom health-cost skill gain. Example: consuming 160 health and 0.01 factor awards 1.6 extra raise amount. [Synced with Server]
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 0.1
Blood Magic Health Cost Skill Raise Factor = 0.01

