[3 - Crafting Skill Effects]

## If on, a deterministic per-item repair ticket can waive a non-zero material cost based on the repairing player's Crafting skill. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Free Repairs = On

## Minimum percent chance for a material-cost repair to be free at Crafting skill 0. Higher skill levels interpolate linearly toward the level-100 setting; values above that maximum are capped to it. [Synced with Server]
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
Free Repair Chance At Level 0 = 10

## Maximum percent chance for a material-cost repair to be free at Crafting skill 100. Lower skill levels interpolate from the configured level-0 minimum. [Synced with Server]
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 100
Free Repair Chance At Level 100 = 30

## Additional percentage points of free-repair chance at Artisan Mastery's Galleon anvil, capped at 100% total chance. For example, 15 changes a 30% chance to 45%, not 34.5%. Applies when a new repair ticket is decided; existing tickets are not rerolled. 0 removes the bonus from new tickets. Enable Free Repairs must be on. The extra free outcome is usable only at an active Galleon anvil. [Synced with Server]
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 100
Galleon Anvil Free Repair Bonus = 15

## Independent per-item bonus-output chance at Crafting skill 100 for eligible stackable results made at a Crafting-skill station. Lower skill levels scale this chance linearly. The default 25 matches Valheim's normal maximum chance for a single-output craft. Set to 0 to disable Crafting-skill bonus output. [Synced with Server]
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0 to 25
Bonus Output Chance At Level 100 = 25

## Comma-, semicolon-, or newline-separated output prefab names that receive no Crafting production bonus. A '*' matches any number of characters and each pattern must match the whole prefab name. Matching is case-insensitive; exact names and wildcard patterns can be mixed. [Synced with Server]
# Setting type: String
# Default value: Simple_*_Socket, Advanced_*_Socket, Perfect_*_Socket
Bonus Output Excluded Prefabs = Simple_*_Socket, Advanced_*_Socket, Perfect_*_Socket

## Maximum percent reduction to queued equipment equip and manual unequip time at Crafting skill 100. Lower skill levels scale the reduction linearly. Set to 0 to disable this feature; 100 makes the queued duration zero at Crafting skill 100. [Synced with Server]
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0 to 100
Equip Time Reduction At Level 100 = 50

