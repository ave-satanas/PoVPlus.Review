# Default value: 15
# Acceptable value range: From 0 to 100
Base Material Cost Percent = 15

## Percent of each current quality increment, (quality - 1) times the recipe amount per level, used for a full repair before the durability bucket multiplier is applied. [Synced with Server]
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
Quality Increment Material Cost Percent = 5

## Damage strictly below this percent has no material cost. At the threshold, normal costs apply to all damage, not just the excess. 0 disables this free band; 100 applies costs only to fully broken items. The existing 10% cost buckets are preserved; allowed damage below 10% uses its exact percentage instead of a zero bucket. [Synced with Server]
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
Free Repair Damage Threshold Percent = 10

## If on, each ingredient with a positive repair cost before stochastic rounding requires at least one item. Does not override the free damage band, zero cost percentages, material exclusions, or Crafting-skill free repairs. Recipes requiring only one ingredient still use only the selected ingredient. [Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Minimum One Material Per Repair = Off

