[Debug]

## Local, read-only Taming Orb diagnostics. Usage: set On, enter a world, reproduce the Orb problem, then set Off. No hotkeys or restart required. Does not repair Orbs.
## Client: keep the affected Orb and, if available, a working Orb in your inventory. Orb use or related Orb traffic automatically starts a trace with before/after inventory reports when available. Off, disconnect, world change or 60 seconds saves it; while On, the next Orb activity starts another trace.
## Reports: BepInEx/config/FeedLikeGrandma/diagnostics in the running profile (uses the active BepInEx config directory). Send the matching .txt and .json files, attempt time/Orb slots, and LogOutput.log. Reports stay local and can include creature names and world/transaction IDs.
## Storage limit: 20 reports or 128 MiB in that folder. Existing reports are never automatically deleted. If saving fails or storage is full, the current report stays in memory and new traces pause. Fix storage or move old reports elsewhere, then switch Off and On to retry before exiting.
## Server: turn On separately on the server for detailed completed-release rejection and unknown-recovery logs in BepInEx/LogOutput.log (each type at most once per 30 seconds). A local host enables both roles. This setting is not server-synced. Turn Off after collecting evidence. [Not Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
OrbDiagnostics = Off

