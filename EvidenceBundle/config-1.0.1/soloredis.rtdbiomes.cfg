## Settings file was created by plugin RtDBiomes v3.2.3
## Plugin GUID: soloredis.rtdbiomes

[Logging]

## Enables logging.
# Setting type: Boolean
# Default value: false
Enable = false

[Wilds Look]

## Replace vanilla trees, rocks and pickables in the land biomes with the Expand World Wilds versions. Only affects newly generated areas. Every player should use the same setting.
# Setting type: Boolean
# Default value: true
Wilds Vegetation = true

## With Wilds Vegetation on: keep ores, pickables, berry bushes and giant remains at vanilla amounts. Turn off for an exact copy of the Wilds biomes (resources become scarce).
# Setting type: Boolean
# Default value: true
Keep Vanilla Resources = true

## With Wilds Vegetation on: how many of the vanilla Mistlands rocks and cliffs to keep. 0 = none (exact Wilds), 0.25 = a light amount, 1 = vanilla.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
Mistlands Rock Amount = 0.25

## With Wilds Vegetation on: how many of the big vanilla Yggdrasil shoots to keep (the source of Yggdrasil wood). 0 = none (exact Wilds), 1 = vanilla.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Mistlands Yggdrasil Amount = 0.5

## With Wilds Vegetation on: multiplies the Wilds Mistlands trees, bushes and fireflies (1 = same as your Wilds files).
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.25 to 4
Mistlands Density = 1.5

## With Wilds Vegetation on: Mistlands trees, bushes and grass may grow on slopes up to this angle (the Wilds files use 20-30, made for flatter ground).
# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 90
Mistlands Max Slope = 40

## With Wilds Vegetation on: how bumpy the ground under Mistlands trees and bushes may be (the Wilds files use 2-3).
# Setting type: Single
# Default value: 6
# Acceptable value range: From 0 to 20
Mistlands Max Terrain Delta = 6

## With Wilds Vegetation on: size multiplier for the Mistlands trees (beech, oak, birch, willow, RtD trees). 1 = normal size.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0.5 to 3
Mistlands Tree Scale = 1.3

## With Wilds Vegetation on: smallest size of the big Yggdrasil shoots, compared to their normal size (1.30 = 30% bigger).
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0.5 to 3
Mistlands Big Tree Scale Min = 1.3

## With Wilds Vegetation on: largest size of the big Yggdrasil shoots, compared to their normal size (1.42 = 42% bigger). Each tree gets a random size between Min and Max.
# Setting type: Single
# Default value: 1.42
# Acceptable value range: From 0.5 to 3
Mistlands Big Tree Scale Max = 1.42

## With Wilds Vegetation on: smallest size of the Mistlands magic trees compared to their normal size (1.25 = 25% bigger).
# Setting type: Single
# Default value: 1.25
# Acceptable value range: From 0.5 to 3
Mistlands Magic Tree Scale Min = 1.25

## With Wilds Vegetation on: largest size of the Mistlands magic trees compared to their normal size (1.42 = 42% bigger).
# Setting type: Single
# Default value: 1.42
# Acceptable value range: From 0.5 to 3
Mistlands Magic Tree Scale Max = 1.42

## With Wilds Grass on: amount of the extra Wilds grass in Mistlands (meadow grass, ferns, forest ground cover). 1 = same as your Wilds files. Visual only, applies on next world load.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 2
Mistlands Extra Grass Amount = 0.75

## Replace vanilla grass and ground cover in the land biomes with the Expand World Wilds versions. Visual only, takes effect on next world load.
# Setting type: Boolean
# Default value: true
Wilds Grass = true

