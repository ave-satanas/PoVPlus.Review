## Share of carried ore and metal a portal keeps when the Ore Portals passive lets it through: 0.25 is a quarter, 0 lets it all through for free.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
Ore portal toll = 0.25

## Adds saplings for wild growth (berries, mushrooms, herbs) to the cultivator: they are planted from the plant's own seed (Forager mastery Cuttings). It clones the game's own sapling to do it, which is why it can be turned off: if anything ever goes wrong with planting, this switch takes the whole thing out.
# Setting type: Boolean
# Default value: true
Wild sowing = true

## With the ore-through-portals choice taken, metal passes portals from the start, without waiting for the boss of its biome. The portal still takes its 25%, and items the game never lets through - eggs and the like - still do not pass.
# Setting type: Boolean
# Default value: false
Ore through portals: no boss required = false

## Goes a step further than the setting above: with the ore-through-portals choice taken, a portal carries everything the game normally refuses, not only metal. The portal still takes its 25% of what it carried.
# Setting type: Boolean
# Default value: false
Ore through portals: carry anything = false

## The convenience mastery - doors from the shoulder, crafting from nearby chests, sleeping by a fire and the rest - is the one place where the tree changes how the game is played rather than how hard it hits. Turned off, those choices are gone from every convenience mastery and only the +2 to all attributes remains, so the points are still worth spending. Whoever took a removed choice gets the point back.
# Setting type: Boolean
# Default value: true
Convenience mastery = true

