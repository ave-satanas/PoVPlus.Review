## ONE SWITCH for everything this mod does to creatures: the biome ladder, rarity, all modifiers, the extra loot, the glow and the name over the health bar. Off means vanilla creatures, and the two switches below stop mattering. Host settings are authoritative.
## ОДНА ГАЛОЧКА на всё, что аддон делает с существами: лестница биомов, редкость, все модификаторы, добыча, свечение и имя над полосой. Выключено - существа ванильные, и два выключателя ниже уже ничего не решают. Настройки задаёт хост.
