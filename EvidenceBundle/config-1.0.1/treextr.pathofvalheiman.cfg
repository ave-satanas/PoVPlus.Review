# Default value: true
Difficulty system = true

## MASTER SWITCH for the biome ladder: creatures get progressively stronger from the Swamp onward. Off leaves every creature at its vanilla health and damage. Neutral animals, dvergr and anything you summon are unchanged either way; tamed beasts keep a share of the strength they had in the wild (Tamed creature strength); a hostile creature the mod does not know by name takes the stage of the biome it stands in, including one added by another mod. Rarity is a separate switch. Host settings are authoritative.
## ГЛАВНЫЙ ВЫКЛЮЧАТЕЛЬ лестницы биомов: существа крепнут начиная с болот. Выключено - у всех ванильное здоровье и урон. Мирные звери, дверги и всё, что призывает игрок, не меняются в любом случае; приручённые сохраняют долю силы, какая была у дикого («Tamed creature strength»); враждебное существо, которого мод не знает по имени, берёт ступень биома, в котором стоит, - в том числе из чужого мода. Редкость выключается отдельно. Настройки задаёт хост.
