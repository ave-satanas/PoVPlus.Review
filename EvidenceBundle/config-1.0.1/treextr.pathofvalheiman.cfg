[0. Main settings]

## Difficulty preset for the world. Choosing one lays its numbers out once; after that every setting is yours.
## Пресет сложности мира. Выбор раскладывает его числа один раз; дальше настройки остаются за тобой.
# Setting type: String
# Default value: Normal
# Acceptable values: Vanilla creatures, Easy, Normal, Hard, Merciless
Difficulty = Normal

## Stop the world while the passive tree is open. Alone, it pauses at once. With others, it pauses only when every player on the server has the tree open, and starts again the moment one of them closes it. A player without the mod never lets it pause.
# Setting type: Boolean
# Default value: true
Pause while the tree is open = true

