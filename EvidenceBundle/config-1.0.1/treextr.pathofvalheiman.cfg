# Setting type: Boolean
# Default value: true
Stars instead of modifiers when tamed = true

## Pulls every modifier at once. It multiplies not the value but how far it differs from nothing, so half strength on Armored means weaker, not 'takes 35% instead of 70%'.
## Тянет все модификаторы разом. Множит не значение, а то, чем оно отличается от «ничего»: половинная сила у бронированного значит «слабее», а не «получает 35% вместо 70%».
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Modifier strength = 1

