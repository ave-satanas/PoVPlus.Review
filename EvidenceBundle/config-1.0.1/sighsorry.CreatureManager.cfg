[2 - Levels]

## Off disables CreatureManager level rules, level damage/health scaling, distance scaling, modifiers, and level visuals. ExceptLevel keeps the levels assigned by the game or other mods, skips CreatureManager level rolls and Karma/Enforcer level bonuses, and applies stat, distance, scale, and modifier rules using the actual level. Full also enables CreatureManager level assignment. In a new default levels.yml, change Global.damagePerLevel from 0.25 to 0.5 to match vanilla per-star damage growth for regular creatures; default health growth already matches vanilla. Other matching rules and modifiers still apply. With no matching scalePerLevel rule, both Full and ExceptLevel use the prefab's original level sizes, including in dungeons; explicit 0 disables star growth, and positive values use CM growth with its dungeon/saddle restrictions. Karma tracking, Enforcer summons, and loot settings remain independent. Explicit spawn-command levels remain available. Changing this setting does not reroll existing creatures. [Synced with Server]
# Setting type: LevelSystemMode
# Default value: Full
# Acceptable values: Off, ExceptLevel, Full
# Legacy On is read as Full; Vanilla is read as ExceptLevel
Enable Level System = Full

## Used only when Enable Level System is Full. Easy, Normal, Hard, and VeryHard supply built-in level weights for vanilla biome names. None removes only these built-in weights; YAML level rules and Karma/Enforcer level bonuses still apply. Explicit biome, group, and prefab level rules in levels.yml override the preset. Global.level is the last fallback for non-boss creatures and Enforcers and is commented out in new files; existing YAML is preserved. If enabled, it supplies weights where no more specific rule or preset matches. Full + None keeps game/other-mod levels where no YAML level rule and no Karma/Enforcer bonus applies. None does not change stat, scale, or modifier rules. ExceptLevel ignores both the preset and all YAML level weights. [Synced with Server]
# Setting type: LevelBiomePreset
# Default value: Easy
# Acceptable values: Easy, Normal, Hard, VeryHard, None
Biome Level Preset = Easy

