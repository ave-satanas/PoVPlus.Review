[Cache]

## Skip creating new cache entries when the drive has less free space than this.
# Setting type: Int32
# Default value: 10
MinimumFreeDiskSpaceGb = 10

## Delete cached bundles that have not been reused for this many days. Set to 0 to disable cleanup.
# Setting type: Int32
# Default value: 0
RetentionDays = 0

[General]

## Enable reusable LZ4 cache redirects for UnityFS asset bundles.
# Setting type: Boolean
# Default value: true
Enabled = true

## Absolute storage root, or empty to use Unity's persistent data path. FastAssetBundleLoader/cache/v1 is created below this root. Use the same root across profiles to share cache files.
# Setting type: String
# Default value: 
CacheRootDirectory = 

