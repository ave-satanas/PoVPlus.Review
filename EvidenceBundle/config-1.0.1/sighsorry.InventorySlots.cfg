## Settings file was created by plugin InventorySlots v1.6.10
## Plugin GUID: sighsorry.InventorySlots

[1 - General]

## When enabled, only server admins can modify this mod's synced configuration. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

## When enabled, items matching the YAML KeepOnDeath list stay in the player inventory instead of moving to the tombstone. When disabled, KeepOnDeath is ignored and death uses the normal tombstone behavior. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Death Keep Rules = On

## When enabled, shows a trash panel below the player inventory. Dropping a held player-inventory item on it opens a confirmation dialog before deleting the held amount. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Inventory Trash Panel = Off

## Range in meters from the hovered chest for Area Quick Stack. Set to 0 to use only that chest. Unused player-built chests can grant ownership before the transfer. The opened-container Place stacks button only uses the current container. [Synced with Server]
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
Area Quick Stack Range = 10

## Range in meters from the hovered chest for Area Take Stacks. Set to 0 to use only that chest. Unused player-built chests can grant ownership before the transfer. The opened-container Take stacks button only uses the current container. [Synced with Server]
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
Area Take Stacks Range = 10

## Allows multiple players to view standard player-built chests. Item changes wait for an approved ownership handoff and fresh contents. Existing access restrictions still apply. The external MultiUserChest mod takes precedence. Changing this setting closes the local inventory and cancels pending actions before reopening. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Multi User Chest = On

## Food fork icon colors in player/container inventories and crafting results. EitrFirst: any positive eitr uses blue; otherwise higher health uses red, and higher or equal stamina uses yellow. Vanilla: use the game's ratio-based colors, including white for balanced food. Affects icons only, not food stats or food-group classification. Changes apply live. [Synced with Server]
# Setting type: FoodForkColorMode
# Default value: EitrFirst
# Acceptable values: EitrFirst, Vanilla
Food Fork Color Mode = EitrFirst

[2 - Client]

## Client-only regular inventory row display mode. Fixed always shows all unlocked regular inventory rows. Expandable restores the last locally remembered visible row count, reveals newly unlocked rows once, and changes it with mouse wheel while the inventory is open. [Not Synced with Server]
# Setting type: InventoryRowsDisplayMode
# Default value: Expandable
# Acceptable values: Fixed, Expandable
Inventory Rows Display Mode = Fixed

