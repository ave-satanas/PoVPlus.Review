# Default value: GroupThenTier
# Acceptable values: TierThenGroup, GroupThenTier
Inventory Sort Mode = GroupThenTier

## Enables transient chest-unlock success effects for hover hold area quick stack/restock. Shows VFX at up to 10 changed containers and plays the SFX once at the interacted container. Nearby players who also enable this setting see the current action, but effects are not saved or replayed for later arrivals. Opened-container buttons do not spawn effects. Not synced with server. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Container Action Success FX = On

## Client-only container preview control. 0 disables the preview. Values above 0 enable it and set how many seconds, up to 1 second, the last valid container remains visible after looking away. A zero-sized placeholder inventory is never used. [Not Synced with Server]
