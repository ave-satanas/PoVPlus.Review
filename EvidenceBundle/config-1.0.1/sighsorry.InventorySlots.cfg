[6 - Inventory Buttons]

## Client-only: favorite restock (Alt+E by default) leaves one item of each kind in each source container so it remains a quick-stack destination. Counts all stacks with the same internal item name together. A container with only one remaining item cannot supply it. Off allows restock to take the last item. Does not affect Take stacks, Take All, or manual moves. Changes apply to subsequent transfers immediately. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Restock Leave One Item = On

## Client-only per-item modes and targets for favorite restock (Alt+E). Format: Stone: 10 | Existing, Wood: 30 | IncludeEmpty, Coins: 500 | Off. Off disables restock while retaining the target; Existing tops up remaining favorite stacks; IncludeEmpty also restores remembered empty favorite slots, or one unassigned empty favorite if this item has no remembered slot or existing favorite stack. Target quantities are positive whole numbers. Saved targets may exceed the current max stack; actual restocking is capped by each live item's current max stack. Keys may be prefab, internal, or localized item names. Separate entries with commas, semicolons, or new lines. Unlisted items use normal existing-stack restock to max. Numeric-only entries, zero targets, and the old refill suffix are unsupported and are not converted; re-register them with this format. Existing items are never moved or replaced. [Not Synced with Server]
# Setting type: String
# Default value: 
Restock Target Stack Limits = 

