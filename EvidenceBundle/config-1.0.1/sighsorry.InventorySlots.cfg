# Acceptable values: Off, On
Auto Favorite Hotbar Switch Row = Off

## Sorting mode used by player inventory and container sort buttons. GroupThenTier sorts predefined group first, then biome/resource tier. TierThenGroup sorts biome/resource tier first, then predefined group. [Not Synced with Server]
