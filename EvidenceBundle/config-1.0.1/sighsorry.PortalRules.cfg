## Protect ordinary player-built portals from player and tamed-creature attacks. Only the Builder's account, members/guests of the Builder's primary Clan, or an admin using debug mode may dismantle them. Hostile creature damage is allowed while a living Builder or trusted Clan player is within 40 metres, with a 10-second departure grace and up to 3 seconds of client caching. Support-loss collapse is allowed only when a trusted player is currently nearby (no departure grace; short polling/cache delay still applies). Environmental wear and actual support values remain unchanged. Admin and creatorless system portals keep their existing rules. Inside an active STUWard, dismantling and damage follow STUWard rules and support-loss collapse is normal; PortalRules protection resumes outside active coverage. Requires STUWard's coverage API. Requires PortalRules on the server and clients; Clan trust depends on the existing Clan integration. [Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Enable Portal Protection = Off

