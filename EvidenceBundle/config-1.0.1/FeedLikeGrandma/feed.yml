# FeedLikeGrandma / PoVPlus species-specific nutrition matrix.
# Final, structurally validated configuration based on the uploaded modpack.
# For installation, back up BepInEx/config/FeedLikeGrandma/feed.yml then replace with this file.
# Local consumeItems values range from 1 to 6; species nutrition and relative progression determine value.
# No taming/growth/breeding parameters are overridden; original Asksvin level-up rule preserved.
# The reference file and other plugin settings are NOT modified.
defaults:                            # Global defaults used when a prefab omits feed.
  feed: [20, 15, 30, 25, 120]         # levelupconstant, tamingconstant, growthconstant, healconstant, fedconstant.
  # effect = foodNumber * constant. levelup/taming/growth/fed are progress or seconds; heal is max-health percent.
  # levelUpItems override level-up food for that level; otherwise consumeItems can also add level progress.
  # level-up-only food still applies healconstant and fedconstant.

foodNumbers:                         # Global numbers used by bare consumeItems; omitted values default to 1.
  - Mushroom
  - Raspberry
  - Honey, 2
  - NeckTail, 1.5
  - NeckTailGrilled, 2
  - RawMeat, 1.5
  - CookedMeat, 2
  - DeerMeat, 2
  - CookedDeerMeat, 2.5
  - Blueberries, 2
  - Carrot, 2
  - BjornMeat, 3
  - CookedBjornMeat, 4
  - Turnip, 2
  - Sausages, 4
  - FishRaw, 3
  - FishCooked, 4
  - SerpentMeat, 4
  - SerpentMeatCooked, 5
  - Onion, 3
  - WolfMeat, 2
  - CookedWolfMeat, 3
  - ChickenMeat, 4
  - CookedChickenMeat, 5
  - MushroomJotunPuffs, 2
  - Barley, 2
  - Cloudberry, 2
  - Flax, 2
  - LoxMeat, 3
  - CookedLoxMeat, 4
  - HareMeat, 4
  - CookedHareMeat, 6
  - MushroomMagecap, 2
  - AsksvinMeat, 3
  - CookedAsksvinMeat, 5
  - VoltureMeat, 3
  - CookedVoltureMeat, 5
  - BoneMawSerpentMeat, 5
  - CookedBoneMawSerpentMeat, 8
  - Fiddleheadfern, 3
  - MushroomSmokePuff, 3
  - Vineberry, 2

# Ashlands: native feed 3; earlier barley 1. Keeps the original Fish11 levelUpItems rule.
