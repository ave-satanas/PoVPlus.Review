## If on, recipes that require a crafting station unlock only after the player has interacted with the required station level. If off, Valheim's normal station discovery behavior is used for recipe station knowledge. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Require Station Interaction For Recipe Unlock = On

## If on, Valheim's normal crafting station discovery radius is used. If off, walking near a crafting station does not discover it; interacting with the station is required. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Station Proximity Discovery = On

## If on, items displayed in an opened container are discovered as if picked up, without moving them. Uses Valheim's normal item discovery, including trophy records and personal raid conditions. Station requirements still apply. Turning this off does not remove discoveries already saved on the character. [Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Learn Materials From Opened Containers = Off

