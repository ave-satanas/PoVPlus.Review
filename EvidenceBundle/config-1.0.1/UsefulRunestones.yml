# UsefulRunestones
#
# runestoneGlobalPins: pinless RuneStones can add map pins for configured locations.
# Row: locationName, chance, pinName, pinType, sourceBiomes
# ex) Vendor_BlackForest, 0.5, Some pin name, Icon3, [Meadows]
# chance is the final selection chance. Remaining chance means no pin; totals over 1 are normalized.
# normalized ex) three targets at 0.5 total 1.5, so each selected target has 0.5 / 1.5 = 33.3%.
# sourceBiomes adds extra RuneStone source biomes; [] means only the target location's own biome.
# pinName defaults to target Location.m_discoverLabel, then child Teleport.m_enterText, then locationName.
# pinType defaults to Icon3. Options: Icon0, Icon1, Icon2, Icon3, Death, Bed, Icon4, Shout, None, Boss, Player, RandomEvent, Ping, EventArea, Hildir1, Hildir2, Hildir3.
runestoneGlobalPins:
  - Vendor_BlackForest, 0.5, Haldor, Icon3
  - CombatRuin01, 0.5
  - Hildir_camp, 0.5
  - BogWitch_Camp, 0.5
  - SunkenCrypt4, 0.5
  - MountainCave02, 0.5
  - StoneHenge1, 0.5
  - StoneHenge3, 0.5
  - StoneHenge4, 0.5
  - StoneHenge5, 0.5
  - Mistlands_DvergrTownEntrance1, 0.5
  - Mistlands_DvergrTownEntrance2, 0.5
  - Mistlands_Excavation1, 0.5
  - Mistlands_Excavation2, 0.5
  - Mistlands_Excavation3, 0.5
  - PlaceofMystery1, 0.5
  - PlaceofMystery2, 0.5
  - PlaceofMystery3, 0.5

# vegvisirGlobalEffects: weighted rewards when a normal Vegvisir interaction succeeds.
# Row: StatusEffect, durationSeconds, cooldownSeconds, weight, effectPrefab
# All is pooled with the current biome row; every other key must be one biome name.
# Each loaded Vegvisir locks one weighted pick until unload; unload/load resets its pick and cooldown state.
# Omitted duration/cooldown use StatusEffect prefab values; omitted weight defaults to 1.
# cooldown 0 = none; cooldown < 0 = once per loaded Vegvisir/player.
# VRS_ClearStatus ignores duration, clears current status effects, and shows "You got bamboozled".
# If the selected StatusEffect is already active, it is not reapplied and no cooldown/fx starts.
# effectPrefab is optional and must start with vfx_, sfx_, or fx_ case-insensitively.
