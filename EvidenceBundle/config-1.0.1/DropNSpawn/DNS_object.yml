# Any file named DNS_object_*.yml or DNS_object_*.yaml is also loaded # ex) DNS_object_rand1.yml, DNS_object_rand2.yaml
# Use DNS_object.reference.yml to look up real prefab names and reference values, DNS_object.locations.reference.yml to see which location roots include a given object prefab, and run `dns:full object` for exhaustive field examples
# Matching drop-table component blocks merge together. If any block matches, vanilla rows for that component are replaced by the union of matching custom rows.
# A conditionless custom entry becomes the custom default for every populated component in that entry.
# Piece-based prefabs are world-only. Player-built instances are not overridden.
#
# dropOnDestroyed
#
# - prefab: goblin_totempole
#   enabled: true
#   conditions: # If these conditions fail, this entry is ignored # Vanilla rows are used only when no custom drop-table entry for that component matches
#     altitude: null # ex) -1000~1000 # Range in world-height meters
#     distanceFromCenter: null # ex) 0~10000 # Range in meters from the world center
#     biomes: [] # ex) [BlackForest, Mistlands] # Allowed biomes # EWD custom biome names also work when EWD is installed
#     locations: [] # ex) [Hildir_camp] # Allowed location prefab names
#     timeOfDay: null # ex) [night] # [day, night]
#     requiredEnvironments: [] # ex) [Rain] # Allowed environment names
#     requiredGlobalKeys: [] # ex) [defeated_gdking] # Required global keys
#     forbiddenGlobalKeys: [] # ex) [nomap] # Forbidden global keys
#     inForest: null # ex) true = forest only # false = outside forest only # null or no field allows both
#     inDungeon: null # ex) true = dungeon only # false = overworld only # null or no field allows both
#     insidePlayerBase: null # ex) true = near player base only # false = away from player base only # null or no field allows both
#   dropOnDestroyed:
#     rolls: 1~1 # ex) 1~3 # Range of successful rolls from this table
#     dropChance: 1 # Chance from 0 to 1 that this table rolls at all
#     oneOfEach: false # True lets each entry roll at most once per table roll
#     drops: # Set drops: [] to disable a drop table
#     - item: null # ex) Wood # Required item prefab name
#       stack: 1~1 # ex) 1~2 # Range of stack size
#       weight: 1 # Relative weight versus other entries in the same table
#       dontScale: false # True skips the game's built-in drop scaling for this entry
#
# mineRock, mineRock5, treeBase, and treeLog
#
# - prefab: MineRock_Copper
#   enabled: true
#   conditions: {}
#   mineRock:
#     health: null # ex) 1000
#     minToolTier: 0 # ex) tier 0 AxeStone/PickaxeAntler, tier 1 AxeFlint/PickaxeBronze, tier 2 AxeBronze/PickaxeIron, tier 3 PickaxeBlackMetal, tier 4 AxeBlackMetal/AxeJotunBane, tier 5 BatteringRam, tier 6 AxeBerzerkr
#     rolls: 1~1
#     dropChance: 1
#     oneOfEach: false
#     drops:
#     - item: null # ex) Stone
#       stack: 1~1 # ex) 1~3 # Range of stack size
#       weight: 1
#       dontScale: false
#
# container
#
# - prefab: TreasureChest_meadows
#   enabled: true
#   conditions: {}
#   container:
#     rolls: 1~1
#     dropChance: 1
#     oneOfEach: false
#     drops:
#     - item: null # ex) Coins # Required item prefab name
#       stack: 1~1 # ex) 10~20 # Range of stack size
#       weight: 1
#       dontScale: false
#
# pickableItem # Use either randomDrops or drop # If both are set, randomDrops takes precedence
#
# - prefab: Pickable_DolmenTreasure
#   enabled: true
#   conditions: {}
#   pickableItem:
#     randomDrops:
#     - item: null # ex) Coins
#       stack: 1~1 # ex) 1~3 # Range of stack size
#       weight: 1
#     drop:
#       item: null # ex) Coins
#       stack: 1
#
# pickable
#
# - prefab: BlueberryBush
#   enabled: true
#   conditions: {}
#   pickable:
#     overrideName: null # Optional display name override
#     drop:
#       item: null # ex) Blueberries
#       amount: 1
#       minAmountScaled: 0 # Minimum final amount after Game.ScaleDrops # ignored when dontScale is true
#       dontScale: false
#     extraDrops:
#       rolls: 1~1
#       dropChance: 1
#       oneOfEach: false
#       drops:
#       - item: null # ex) Wood
