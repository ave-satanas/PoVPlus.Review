# This file is auto-loaded from DNS_spawnsystem.yml or DNS_spawnsystem.yaml, plus any DNS_spawnsystem_*.yml/.yaml files.
# Loaded files are concatenated in filename order after the primary file.
# This auto-created override is seeded from the current live SpawnSystem snapshot only and does not merge external CreatureManager/Jotunn reference projections.
# Use dns:reference spawnsystem when you want to export DNS_spawnsystem.reference.yml for a compact reference snapshot, or DNS_spawnsystem.full.yml for exhaustive field examples.
# Applying this file still strictly replaces the live SpawnSystem table with the rows defined here.
# requiredGlobalKey also supports 'key 10' to require at least that numeric value and consume it after each successful spawn.
# - prefab: Boar
#   spawnSystem: # Flat SpawnSystem row # Controls spawn timing, placement, limits, native conditions, and custom data
#     name: null # ex) Boar # Optional row name # Omit to default to the prefab name in this compressed format
#     huntPlayer: false # True marks the spawned AI as hunting the player
#     level: 1~1 # ex) 1~3 # Range of spawned creature levels
#     overrideLevelUpChance: -1 # Use -1 to keep native behavior # Percent per extra level roll
#     levelUpMinCenterDistance: 0 # Meters from the world center before native level-up rolls start
#     groundOffset: 0.5 # Meters of vertical placement offset
#     groundOffsetRandom: 0 # Range in meters of random vertical placement offset
#     spawnInterval: 4 # ex) 100 # Seconds between spawn checks
#     spawnChance: 100 # Percent chance per successful check
#     spawnRadius: 40~80 # ex) 20~60 # Range in meters from one player to the chosen spawn center # Native effective default; 0 on min/max uses the native 40/80 fallback
#     groupSize: 1~1 # ex) 1~3 # Range of creatures spawned by one successful attempt
#     groupRadius: 3 # Meters from the chosen spawn center to each spawned creature
#     noSpawnRadius: 10 # Meters from the chosen spawn center used to block the attempt if the same prefab is already nearby
#     maxSpawned: 1 # Active prefab count cap in the wider area loaded around players
#     tilt: 0~35 # Range in degrees of allowed ground tilt
#     altitude: -1000~1000 # Range in world-height meters
#     oceanDepth: 0~0 # ex) 0~10 # Range in meters of water depth at the spawn point # 0~0 leaves the native depth check effectively unconstrained
#     distanceFromCenter: 0~0 # ex) 0~10000 # Range in meters from the world center # 0~0 leaves the native distance check effectively unconstrained
#     biomes: [Meadows] # Allowed spawn biomes # Expand World Data custom biome names and numeric biome masks also work when EWD is installed
#     biomeAreas: [Everything] # Allowed values: Edge, Median, Everything # Edge = biome border band # Median = biome interior # Everything = both
#     timeOfDay: null # ex) [day, night]
#     requiredEnvironments: [] # ex) [Rain, Clear] # Allowed environment names
#     requiredGlobalKey: '' # ex) defeated_gdking # Native default is '' # Supports 'key 10' numeric syntax too
#     requiredPersistentEvent: '' # Internal name of the persistent event required at the spawn center # Empty = no requirement
#     inLava: false # True = lava only # False = outside lava only
#     inForest: null # ex) true = forest only # false = outside forest only # null or no field allows both
#     insidePlayerBase: false # False = outside player-base influence only
#     canSpawnCloseToPlayer: false # True allows close-to-player spawns
#     fields: {} # ex) { Character.m_name: $enemy_boar, health: 200, damage: 2 } # Expand World Data field overrides
#     objects: [] # ex) [Wood,0,0,0,1] # Expand World Data object entries
#     data: null # Expand World Data data entry name from your EWD config
#     faction: null # ex) ForestMonsters # Values: Players, AnimalsVeg, ForestMonsters, Undead, Demon, MountainMonsters, SeaMonsters, PlainsMonsters, Boss, MistlandsMonsters, Dverger, PlayerSpawned, TrainingDummy, DeepNorth
#
# Optional file header: '- spawnIntervalMultiplier: 2.0' must be the first list item and scales only this file's SpawnSystem intervals.
# The multiplier must be greater than zero. 0.5 halves intervals (more frequent checks); 2.0 doubles intervals (less frequent checks).
