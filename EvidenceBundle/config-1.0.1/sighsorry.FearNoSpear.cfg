## Settings file was created by plugin FearNoSpear v1.1.3
## Plugin GUID: sighsorry.FearNoSpear

[General]

## Locks OwnerOnlyTombstones to the server's config when the mod is installed on a server. Personal indicator and death-pin settings are not locked. Spear rescue and thrower-only auto-pickup use fixed rules and have no config switches. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

## Display your thrown spears and supported SecondaryAttacks copied throws, including ImpactBurst. BeamAndHud (default): a 500-meter column plus an item icon and distance. Beam: column only, subject to render distance and terrain. Hud: icon, distance, and screen-edge directions, visible through terrain and beyond world rendering distance. Off: stops weapon indicators and weapon queries, not protection or tombstone indicators. No real lights or forced zone loading are used. This is a personal setting. [Not Synced with Server]
# Setting type: IndicatorStyle
# Default value: BeamAndHud
# Acceptable values: BeamAndHud, Beam, Hud, Off
SpearIndicatorStyle = BeamAndHud

## Maximum number of your landed or rescued thrown weapons to display, nearest first. Includes supported SecondaryAttacks copied throws. Range: 1 to 5; default: 1. Nearby drops are followed as they move; distant server positions refresh every 5 seconds. Weapons and tombstones share one request. Use SpearIndicatorStyle = Off to disable weapon indicators. This is a personal setting. [Not Synced with Server]
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 5
MaxDisplayedSpears = 1

## Shows your newest remaining tombstones in this world, up to MaxDisplayedTombstones. BeamAndHud (default), Beam, Hud, or Off. HUD markers use the death icon, distance on the right, and elapsed in-game days/hours below the icon, such as 2d 12h. Age uses the world's clock and day length, not real calendar time; sleeping advances it. Nearby positions follow the tombstone; distant positions refresh from the server every 5 seconds. Fully recovered tombstones disappear from the display. Independent of CleanDeathPins and map pins. This is a personal setting. [Not Synced with Server]
# Setting type: IndicatorStyle
# Default value: BeamAndHud
# Acceptable values: BeamAndHud, Beam, Hud, Off
TombstoneIndicatorStyle = BeamAndHud

## Maximum number of your remaining tombstones to display, newest first rather than nearest first. Range: 1 to 5; default: 1. Independent of MaxDisplayedSpears. Changing this count does not add server requests. Use TombstoneIndicatorStyle = Off to hide tombstone indicators. This is a personal setting. [Not Synced with Server]
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 5
MaxDisplayedTombstones = 1

## Removes your vanilla death map pin when your tombstone is recovered, and removes the pin after a short grace period when a death creates no tombstone. Affects your own map only. This personal preference is not synchronized or locked by the server. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
CleanDeathPins = true

## Prevents players from opening or auto-looting a tombstone owned by another player. A server administrator or the local host can bypass this mod's owner restriction while debug mode is active. On a dedicated server, FearNoSpear must be installed on the server and ServerSync must finish confirming administrator access. This does not enable debug mode or override other mods' locks, inventory capacity, or containers already in use. When the optional Clan mod is installed, members of the local player's active Clan roster, including Guests, may also recover it. Tombstones without a valid owner ID remain accessible. This setting is synchronized and enabled by default. [Synced with Server]
# Setting type: Boolean
# Default value: true
OwnerOnlyTombstones = true

