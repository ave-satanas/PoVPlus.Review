## Settings file was created by plugin MyDirtyHoe v2.3.3
## Plugin GUID: MagicMike.MyDirtyHoe

[1 - General Settings]

## Enable this plugin.
##  [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Plugin = true

## Enable the status effect while using the hoe.
## (Restart required).
##  [Synced with Server]
# Setting type: Boolean
# Default value: false
Enable Status Effect = false

## Adds the Clear Forestry piece to the Paint category, after Clear Clutter.
## It removes trees, stumps, shrubs, rocks and pickables inside the brush circle, like the remove_forestry console command. Nothing is dropped.
## Takes effect the next time a world is loaded.
##  [Synced with Server]
# Setting type: Boolean
# Default value: false
Enable Clear Forestry Tool = false

## Adds a Planting category to the Dirty Hoe with the cultivator's seeds and saplings, including ones other mods add to the cultivator.
## Planting with the hoe raises the Farming skill, like the cultivator.
## Takes effect the next time the hoe is equipped.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Planting Category = true

## Let the size of Landscaping pieces be changed while placing them with the Dirty Hoe.
## Pieces already placed keep their size either way.
##  [Synced with Server]
# Setting type: Boolean
# Default value: false
Enable Scaling = false

## Show the hotkeys that work with each Dirty Hoe tool, as they are set in this config, in a panel beside the selected piece's info.
##  [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Show Hotkeys In Tool Descriptions = true

[10 - Misc Settings]

## Enable durability drain for the hoe.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Durability Drain = true

## Enable stamina usage for the hoe.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Stamina Usage = true

## Enable resource costs for the hoe.
## Applies to raising terrain, paving terrain, placed stones and rocks, the ramp and the road.
## (Restart required).
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Enable Resource Costs = true

## Enable requirement of stone-cutter workbench for paving terrain and placing Landscaping stones and rocks.
##  [Synced with Server]
# Setting type: Boolean
# Default value: true
Workbench Requirement = true

## Use the Circle or Square shape when flattening terrain.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Flatten Tool Shape = Square

## Use the Circle or Square shape when raising terrain.
## Circle rises highest in the middle and slopes off to the edge; Square raises the whole area.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Raise Tool Shape = Square

## Use the Circle or Square shape for the Reset Terrain piece and the Reset Hotkey.
## Square shows a grid like the square flatten tool.
##  [Not Synced with Server]
# Setting type: Shape
# Default value: Square
# Acceptable values: Circle, Square
Reset Tool Shape = Square

## Hotkey to switch the Flatten, Raise, and Reset tool shapes between Circle and Square while holding the hoe.
## All three switch together.
## Use one key, or join keys with +, for example LeftControl + G. Set to None to turn it off.
##  [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: S + LeftAlt
Shape Toggle Hotkey = S + LeftAlt

## How thickly the clutter brushes in the Paint category paint.
## 1 is the game's normal clutter density, higher is denser.
## Only applies to clutter painted after the change.
##  [Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 8
Clutter Brush Density = 1

## Use the mod's high resolution textures for the clutter brushes in the Paint category and the rocks in the Landscaping category, where it has one.
## Only what you paint or place changes; the world's own grass and rocks keep the game's textures.
##  [Not Synced with Server]
# Setting type: Boolean
# Default value: true
HD Textures = true

## Hotkey to turn HD Textures on or off while holding the hoe.
## Use one key, or join keys with +, for example LeftAlt + H. Set to None to turn it off.
##  [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: H + LeftAlt
HD Textures Hotkey = H + LeftAlt

## Hotkey to undo the last terrain change made with the Dirty Hoe while holding it.
## Covers the terrain tools, the ramp, the Reset Terrain piece and the Reset Hotkey. Resources and durability are not given back.
## Use one key, or join keys with +, for example LeftAlt + C. Set to None to turn it off.
##  [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: C + LeftAlt
Undo Hotkey = X + LeftAlt

## How many terrain changes are remembered for the Undo Hotkey, and how many plants for the Step Back Key.
## The history is cleared when you leave the world.
##  [Not Synced with Server]
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 20
Undo Steps = 5

## How loud the Frog in the Landscaping category croaks.
## 1 is its normal volume, 0 is silent.
##  [Not Synced with Server]
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
Frog Volume = 0.3

