# Odin Horse mount seats v3
# Rideable tames with mounted combat. Add a block to add a tame, delete one to remove it.
#
#   LegsOut      degrees, legs spread out
#   ThighsDown   degrees, thighs swing down
#   KneeBend     degrees, knees bend more
#   FeetOut      degrees, lower legs swing out
#   SeatHeight   meters, sit higher
#   SeatForward  meters, sit further forward
#   SeatTilt     degrees, whole rider tips forward
#   LeanForward  degrees, upper body leans forward
#   MeleeReach   meters, extra melee reach
#   PickupReach  meters, extra pickup reach
#   KeepRidingAnimation  true = keep the tame's own riding animation (attacks still work; only the reach values are used)
#
# Example (OdinBear): remove the '#' to use it.
#MidgardBear:
#  LegsOut: 14
#  ThighsDown: 0
#  KneeBend: 0
#  FeetOut: 0
#  SeatHeight: 0
#  SeatForward: 0.16
#  SeatTilt: 0
#  LeanForward: 0
#  MeleeReach: 0.25
#  PickupReach: 0.25

