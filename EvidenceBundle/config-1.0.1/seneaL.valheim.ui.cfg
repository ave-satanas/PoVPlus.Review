[Map]

## Ore deposits (copper, tin, silver, iron scrap and the like) you run past are found automatically: a map marker named after the ore is placed and a ping is made. Off by default; the options below only work when this is on.
# Setting type: Boolean
# Default value: false
OreDetect = false

## How close, in metres, you must come to a deposit for it to be found.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 10 to 60
OreRadius = 15

## Ore kinds that are not marked automatically, separated by commas (copper, tin, silver, iron, flametal, other). Edited with the switches in F7 → Map → Ore; empty = all kinds are marked.
# Setting type: String
# Default value: 
OreSkip = 

## A found deposit gets a map marker with the ore name and the share of ore left in it.
# Setting type: Boolean
# Default value: true
OrePin = true

## A found deposit is pinged with the ore name (only you see it).
# Setting type: Boolean
# Default value: true
OrePing = true

## The marker of a deposit shows the share of ore left and keeps it up to date while you are near enough for the game to load the deposit.
# Setting type: Boolean
# Default value: true
