[Automation]

## Pick up everything around the target at once: hold [Keys] AreaPickup and press the use key on a pickable (berries, crops, mushrooms, flowers, stones...) or a beehive.
# Setting type: Boolean
# Default value: false
AreaPickup = false

## Radius around the target that area pickup collects from, meters.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 10
AreaRadius = 3

## Area pickup only collects the same kind of thing as the target (only raspberries around a raspberry bush). Off = everything pickable around it.
# Setting type: Boolean
# Default value: false
AreaSameOnly = false

## Autosmelters: furnaces, kilns, fires, torches and cooking stations that are switched on in their window (hold [Keys] SmelterWindow and press use) take their ore, wood and fuel from your bag and, when crafting from nearby chests is allowed, from nearby chests, in the order set in the window. Pressing the use key on a switched-on station loads it; [Automation] SmelterAuto does it by itself.
# Setting type: Boolean
# Default value: false
Smelters = true

## Holding [Keys] SmelterWindow and pressing the use key on a smelter, fire or torch opens a window where you switch materials on and off, set their order and the reserve and limit rules.
# Setting type: Boolean
# Default value: true
SmelterWindow = true

## The station window lists every ore and fuel the station can take, also the ones you have not found yet. Off: only the materials you already know are listed.
# Setting type: Boolean
# Default value: false
SmelterShowAll = false

## Switched-on stations top themselves up every second and a half without pressing the use key (within about 40 m of you). Needs [Automation] Smelters.
# Setting type: Boolean
# Default value: false
SmelterAuto = true

## Looking at a smelter shows the ore waiting inside it and its fuel in a panel under the hover text, like the contents of a chest.
# Setting type: Boolean
# Default value: true
SmelterHover = true

## Older saved order and switches of the smelter window, shared by building type (prefab:+Item,Item;...). Each smelter, fire or torch now keeps its own settings in the world; this is used only until its window is changed once. Edited through the window.
# Setting type: String
# Default value: 
SmelterOrder = 

