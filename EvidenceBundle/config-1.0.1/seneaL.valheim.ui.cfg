## Building also takes materials from nearby chests.
# Setting type: Boolean
# Default value: false
BuildFromChests = false

## Distance from you within which chests are used for building, meters.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 100
BuildRange = 30

## Draw links from a crafting station you look at to the chests it can take materials from.
# Setting type: Boolean
# Default value: false
ChestLinks = false

## This mod's quick stack into nearby chests and restock from them (the inventory buttons, their keys and the gamepad chords). Off = both are off, for example to leave them to another mod; consolidate stays.
# Setting type: Boolean
# Default value: true
QuickStack = true

## Distance within which nearby chests are used by the quick stack / restock / consolidate buttons, meters.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 100
StackRange = 10

