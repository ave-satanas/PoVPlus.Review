## Show the quiver slot (BetterArchery, BowsBeforeHoes) on the equipment doll. Off: whatever is worn in it is taken off and moved into the inventory (dropped on the ground when there is no room), and the mod's item works the way it does without this interface.
# Setting type: Boolean
# Default value: true
Quiver = true

## Show the backpack slot (Adventure Backpacks) on the equipment doll. Off: whatever is worn in it is taken off and moved into the inventory (dropped on the ground when there is no room), and the mod's item works the way it does without this interface.
# Setting type: Boolean
# Default value: true
Backpack = true

## Show the two ring slots (Epic Loot) on the equipment doll. Off: whatever is worn in it is taken off and moved into the inventory (dropped on the ground when there is no room), and the mod's item works the way it does without this interface.
# Setting type: Boolean
# Default value: true
Rings = true

## Show the necklace slot (Jewelcrafting) on the equipment doll. Off: whatever is worn in it is taken off and moved into the inventory (dropped on the ground when there is no room), and the mod's item works the way it does without this interface.
# Setting type: Boolean
# Default value: true
Necklace = true

