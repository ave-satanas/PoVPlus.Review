# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 50
OreThreshold = 5

## Pointing at a portal on the world map draws an animated line to the portal it is linked to (the one with the same tag) and makes both blink. Off = nothing is drawn. Needs [Map] LivePortals.
# Setting type: Boolean
# Default value: true
PortalLinks = false

## Pointing at a portal on the world map draws an animated dashed line to the portal it is linked to (the one with the same tag) and keeps it for this many seconds. Needs [Map] LivePortals and PortalLinks.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 15
PortalLinkTime = 4

## Ships (raft, karve, longship...) appear on the map, the minimap and the compass by themselves and move with the ship. The Vehicles filter chip on the map hides them too; a left click on one hides that ship until you switch this off and on.
# Setting type: Boolean
# Default value: false
LiveShips = false

## Carts appear on the map, the minimap and the compass by themselves and move with the cart. The Vehicles filter chip hides them too; a left click on one stops tracking that cart until you switch this off and on.
# Setting type: Boolean
# Default value: false
LiveCarts = false

## Portals appear on the map, the minimap and the compass with their tag as the name. The portal filter chip on the map hides them; a left click on one hides that portal until you switch this off and on.
# Setting type: Boolean
# Default value: false
