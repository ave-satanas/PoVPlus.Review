[20 - Ship Tweaks]

## Multiplier for the minimap exploration radius while controlling, standing on, or inside a ship. [Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 10
Explore Radius Multiplier = 1

## Multiplier for wind-driven force at Half or Full and manual propulsion at Slow or Back. It also scales paddle steering at Slow or Back, but not speed-based steering or rudder response. This mainly changes acceleration rather than setting top speed directly. 1 is vanilla; 0 removes these propulsion forces and paddle steering. [Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
Ship Power Multiplier = 1

## Additional paddling-force ratio contributed by each helmsman or seated passenger who holds the Run input and spends a base 10 stamina per second. 0.5 adds 50% of the ship's globally scaled paddling force per active player at Back or Slow; merely sitting aboard adds nothing. Power Paddling is unavailable at Half or Full while the sails are deployed. 0 disables Power Paddling. Each active player's own camera field of view smoothly increases by up to 10 degrees; other paddlers do not stack additional FOV on that player. [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Power Paddling Bonus Per Player = 0.5

## Client-only. Show a short paddling hint while eligible to paddle: beside the steering controls for the helmsman, or at the bottom center for seated passengers. Independent of the game's Key Hints setting. Turning this off hides only the HUD; Power Paddling still works. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Show Power Paddling HUD = On

## 0 disables field ship repair and preserves vanilla repair behavior. Otherwise, this is the missing ship health repaired per Wood when the repairing player is outside the ship's required build-station range. Range is checked from the player's position. Ships with Build Station set to None use a Workbench as their repair-station fallback. Repairs within range are free, and the ship is still repaired to full health in one action. [Synced with Server]
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 1000
Ship Repair Durability Per Wood = 200

## Comma-separated, case-sensitive ship prefab names allowed to use field repair in boiling Ashlands waters. The ship's position and the game's Ashlands ocean check are used, including custom boiling regions provided by Expand World Data. Does not restrict repairs within the required station range or change existing no-cost/no-workbench exceptions. Empty means no ships may use field repair in boiling waters. Uses ship prefab names, not bottle item names. [Synced with Server]
# Setting type: String
# Default value: VikingShip_Ashlands
Ashlands Field Repair Prefabs = VikingShip_Ashlands

