## When true, etched runestones can be slotted into shard slots.
## When false, no runestone can be slotted. Runestones already in a slot stay there but grant nothing, and can always be taken out (whatever Rune Removal Mode says), but not put back. Turning this back on restores their effects.
## Default: true. [Synced with Server]
# Setting type: Boolean
# Default value: true
Allow Rune Socketing = true

## When false, an effect that is already socketed on an item cannot be socketed again. [Synced with Server]
# Setting type: Boolean
# Default value: false
Allow Duplicate Socketed Effects = false

## When true, a shardstone may be socketed even when the item already has that same effect from being enchanted/rolled. [Synced with Server]
# Setting type: Boolean
# Default value: false
Allow Shardstone On Matching Item Effect = false

## When true, a runestone may be socketed even when the item already has that same effect from being enchanted/rolled. [Synced with Server]
# Setting type: Boolean
# Default value: false
Allow Runestone On Matching Item Effect = false

## Controls whether a shardstone can be taken back out of a socket once it has been placed. Shards can always be inserted; this only affects removal.
## Free = shards can be freely removed and moved to another item.
## BreakValueless = a shard granting an effect that has no rarity-scaled value (Warmth, for example) must be broken to be removed, destroying it. A shard granting a rarity-scaled value, or granting nothing at all on that item, can still be freely removed.
## BreakAll = every shard must be broken to be removed, destroying it.
## Permanent = every shard is permanent; it can be neither removed nor broken.
## Default: BreakValueless. [Synced with Server]
# Setting type: ShardSocketMode
# Default value: BreakValueless
# Acceptable values: Free, BreakValueless, BreakAll, Permanent
Shard Removal Mode = BreakValueless

## Controls whether a runestone can be taken back out of a socket once it has been placed. This only affects removal, and only while Allow Rune Socketing is on; while it is off, every slotted rune can be freely removed.
## Free = runes can be freely removed and moved to another item.
## Break = a socketed rune must be broken to be removed, destroying it.
## Permanent = a socketed rune is permanent; it can be neither removed nor broken, and no other rune can be swapped into its socket.
## Default: Free. [Synced with Server]
# Setting type: RuneSocketMode
# Default value: Free
# Acceptable values: Free, Break, Permanent
Rune Removal Mode = Free

## Controls whether more than one shardstone of the same color may sit on a single item. A shard's effect comes from its color and the item's type, so two shards of one color always grant the same effect.
## Blocked = a color already socketed on an item cannot be socketed into it again.
## Diminishing = allowed, with each further shard of that color contributing a decayed fraction of its value (see Shard Stack Decay Factor).
## Full = allowed at full value; every shard of the color contributes its whole effect.
## Shards whose effect has no rarity-scaled value (Warmth, for example) can never be stacked -- halving a yes/no effect would leave a dead socket. Boss and other exclusive shards keep their own one-per-item / one-per-worn-set rule regardless of this setting.
## Default: Diminishing. [Synced with Server]
# Setting type: ShardStackMode
# Default value: Diminishing
# Acceptable values: Blocked, Diminishing, Full
Shard Stack Mode = Diminishing

## Under Shard Stack Mode = Diminishing, the share of its value each further shard of the same color contributes. The shards of a color are ranked strongest first, and the shard at rank R is worth (factor ^ R) of its normal value -- so 0.5 gives full, half, a quarter, an eighth, and so on down the stack.
## 0 = additional shards of a color contribute nothing.
## 1 = no decay (equivalent to Shard Stack Mode = Full).
## Min = 0, Max = 1 [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Shard Stack Decay Factor = 0.5

## When true, a slotted runestone whose effect the item already has -- rolled on the item, from a shardstone, or from another runestone -- contributes only a decayed fraction of its value (see Rune Stack Decay Factor). Such a rune can only be slotted while Allow Duplicate Socketed Effects or Allow Runestone On Matching Item Effect allows it. The runestone itself is not changed: taken back out, it has its full value again.
## Runes whose effect has no rarity-scaled value (Warmth, for example) are never reduced.
## Default: true. [Synced with Server]
# Setting type: Boolean
# Default value: true
Rune Diminishing Returns = true

## Under Rune Diminishing Returns, the share of its value each repeated runestone contributes. The item's own rolled effect and any shardstone granting the same effect count first, then the item's runestones of that effect, strongest first; the rune at rank R is worth (factor ^ R) of its normal value. With 0.5, a rune repeating an effect the item already rolled is worth half, a second such rune a quarter, and so on.
## 0 = repeated runes contribute nothing.
## 1 = no decay (equivalent to Rune Diminishing Returns off).
## Min = 0, Max = 1 [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Rune Stack Decay Factor = 0.5

## Controls what happens to the source item when a rune is extracted from it.
## KeepItem = the item is returned untouched.
## ReduceEnchants = the extracted enchantment is removed from the item (item kept).
## ReduceEnchantsAndRarity = the extracted enchantment is removed, the item's rarity is reduced one tier, and remaining effect values are clamped to the new rarity's max.
## DestroyItem = the item is consumed.
## If the extracted enchantment is the item's only enchantment, the item reverts to a normal item.
## Default: ReduceEnchants. [Synced with Server]
# Setting type: RuneExtractMode
# Default value: ReduceEnchants
# Acceptable values: KeepItem, ReduceEnchants, ReduceEnchantsAndRarity, DestroyItem
Rune Extract Mode = ReduceEnchants

